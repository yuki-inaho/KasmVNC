name: Noble security build
on:
  push:
    branches: [security/noble-2026-10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout public web client at its pinned commit
        run: git submodule update --init kasmweb
      - name: Cache regression with address and leak sanitizers
        run: |
          cmake -S tests/enccache -B /tmp/enccache-build -DENABLE_ASAN=ON
          cmake --build /tmp/enccache-build
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir /tmp/enccache-build --output-on-failure
      - name: Reuse checksum-verified official 1.5.0 web client
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/kasmtech/KasmVNC/releases/download/v1.5.0/kasmvncserver_noble_1.5.0_amd64.deb \
            -o /tmp/upstream.deb
          echo 'f599fe02e2175b9817b6165f74a5d2bebdc73118dde9181ba3410963bed7ae1e  /tmp/upstream.deb' | sha256sum --check
          dpkg-deb -x /tmp/upstream.deb /tmp/upstream
          test -f /tmp/upstream/usr/share/kasmvnc/www/vnc.html
          mkdir -p builder/www
          cp -a /tmp/upstream/usr/share/kasmvnc/www/. builder/www/
          touch builder/www
      - name: Build Noble package
        env:
          KASMVNC_COMMIT_ID: ${{ github.sha }}
        run: builder/build-package ubuntu noble
      - name: Verify packaged server
        run: |
          set -euo pipefail
          mapfile -t packages < <(find builder/build/noble -name '*.deb' ! -name '*dbgsym*')
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y "${packages[0]/#/.\/}"
          Xvnc -version 2>&1 | tee /tmp/xvnc-version.txt
          grep -F '12101025' /tmp/xvnc-version.txt
          cd builder/build/noble
          sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kasmvnc-noble-${{ github.sha }}
          path: |
            builder/build/noble/*.deb
            builder/build/noble/SHA256SUMS
          if-no-files-found: error
      - name: Publish versioned package for workspace image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find builder/build/noble -name '*.deb' ! -name '*dbgsym*')
          test "${#packages[@]}" -eq 1
          mkdir -p release-assets
          cp "${packages[0]}" release-assets/kasmvncserver_noble_amd64.deb
          cd release-assets
          sha256sum kasmvncserver_noble_amd64.deb | tee SHA256SUMS
          tag="v1.5.0-noble-${GITHUB_SHA:0:12}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Noble security build ${GITHUB_SHA:0:12}" \
            --notes "KasmVNC 1.5.0 with PRs #372, #362 and #369; X.Org 21.1.25. Package build and sanitizer tests passed. Workspace runtime acceptance is tracked separately." \
            kasmvncserver_noble_amd64.deb SHA256SUMS
